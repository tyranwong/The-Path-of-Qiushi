<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Serif SC','Songti SC','SimSun',serif" xml:lang="zh-CN">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="88%">
      <stop offset="0%" stop-color="#F6EEDB"/>
      <stop offset="62%" stop-color="#F3EAD7"/>
      <stop offset="100%" stop-color="#E7D9BF"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9E7BF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F3EAD7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F3EAD7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
  <rect x="48" y="48" width="1504" height="804" fill="none" stroke="#3A3328" stroke-width="2" opacity="0.5"/>
  <rect x="60" y="60" width="1480" height="780" fill="none" stroke="#3A3328" stroke-width="1" opacity="0.22"/>

  <!-- 远山 -->
  <g fill="#3A3328">
    <path d="M0,470 L220,360 L380,440 L520,322 L700,430 L880,340 L1060,452 L1280,352 L1440,442 L1600,362 L1600,530 L0,530 Z" opacity="0.10"/>
    <path d="M0,505 L260,414 L430,482 L620,402 L820,492 L1040,422 L1230,492 L1420,432 L1600,482 L1600,545 L0,545 Z" opacity="0.18"/>
    <path d="M0,536 L300,462 L540,524 L820,464 L1120,532 L1360,472 L1600,524 L1600,568 L0,568 Z" opacity="0.30"/>
  </g>

  <!-- 西行小路 -->
  <path d="M150,830 C 360,790 540,726 660,628 C 780,528 900,478 1030,438 C 1150,402 1260,390 1350,384"
        fill="none" stroke="#3A3328" stroke-width="3.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M150,830 C 360,790 540,726 660,628 C 780,528 900,478 1030,438 C 1150,402 1260,390 1350,384"
        fill="none" stroke="#3A3328" stroke-width="1" opacity="0.2" stroke-linecap="round" transform="translate(0,8)"/>

  <!-- 飞鸟 -->
  <g stroke="#3A3328" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M980,240 q18,-14 36,0 M980,240 q18,14 36,0"/>
    <path d="M1080,210 q15,-11 30,0 M1080,210 q15,11 30,0"/>
    <path d="M930,275 q13,-10 26,0 M930,275 q13,10 26,0"/>
  </g>

  <!-- 学子剪影（背行囊，拄杖西行） -->
  <g fill="#3A3328">
    <rect x="632" y="560" width="7" height="250" rx="3" transform="rotate(9 635.5 560)"/>
    <path d="M572,748 L558,808 L584,808 L590,748 Z"/>
    <path d="M626,748 L636,806 L660,806 L652,748 Z"/>
    <path d="M556,612 Q604,592 650,612 L652,750 L552,750 Z"/>
    <path d="M650,612 Q708,600 714,654 Q716,726 692,750 L652,750 Z"/>
    <circle cx="602" cy="566" r="27"/>
    <path d="M574,560 Q602,544 630,560 L630,566 L574,566 Z"/>
    <rect x="566" y="700" width="9" height="52" rx="4" transform="rotate(-8 570.5 700)"/>
  </g>

  <!-- 书箱 -->
  <g fill="#3A3328">
    <rect x="452" y="776" width="92" height="46" rx="4"/>
    <rect x="460" y="768" width="76" height="10" rx="2"/>
    <rect x="460" y="748" width="58" height="10" rx="2"/>
    <rect x="460" y="728" width="44" height="10" rx="2"/>
  </g>

  <!-- 提灯 -->
  <circle cx="716" cy="744" r="86" fill="url(#glow)" opacity="0.75"/>
  <g fill="#3A3328">
    <rect x="712" y="678" width="8" height="52" rx="4"/>
    <path d="M700,730 h32 l-6,44 h-20 Z"/>
  </g>
  <g stroke="#3A3328" stroke-width="2" fill="none" opacity="0.85">
    <line x1="702" y1="740" x2="730" y2="740"/>
    <line x1="702" y1="758" x2="730" y2="758"/>
  </g>

  <!-- 朱砂「求是」印章 -->
  <g transform="translate(1436,84)">
    <rect x="0" y="0" width="96" height="96" fill="none" stroke="#A13A2A" stroke-width="3" rx="3"/>
    <rect x="7" y="7" width="82" height="82" fill="none" stroke="#A13A2A" stroke-width="1" rx="2"/>
    <text x="48" y="45" text-anchor="middle" font-size="27" fill="#A13A2A">求</text>
    <text x="48" y="78" text-anchor="middle" font-size="27" fill="#A13A2A">是</text>
  </g>
</svg>
