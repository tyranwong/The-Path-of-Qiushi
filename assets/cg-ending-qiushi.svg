<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Serif SC','Songti SC','SimSun',serif" xml:lang="zh-CN">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="88%">
      <stop offset="0%" stop-color="#F6EEDB"/>
      <stop offset="62%" stop-color="#F3EAD7"/>
      <stop offset="100%" stop-color="#E7D9BF"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9E7BF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F3EAD7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F3EAD7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
  <rect x="48" y="48" width="1504" height="804" fill="none" stroke="#3A3328" stroke-width="2" opacity="0.5"/>
  <rect x="60" y="60" width="1480" height="780" fill="none" stroke="#3A3328" stroke-width="1" opacity="0.22"/>

  <!-- 暖黄光晕 -->
  <circle cx="620" cy="430" r="320" fill="url(#glow)" opacity="0.55"/>
  <circle cx="820" cy="470" r="130" fill="url(#glow)" opacity="0.85"/>

  <!-- 书桌 -->
  <g fill="#3A3328" opacity="0.92">
    <rect x="160" y="600" width="1280" height="26" rx="4"/>
    <rect x="210" y="626" width="20" height="196"/>
    <rect x="1370" y="626" width="20" height="196"/>
  </g>

  <!-- 书堆 -->
  <g fill="#3A3328">
    <rect x="300" y="566" width="150" height="18" rx="3"/>
    <rect x="312" y="548" width="126" height="18" rx="3"/>
    <rect x="324" y="530" width="102" height="18" rx="3"/>
    <rect x="338" y="512" width="76" height="18" rx="3"/>
  </g>

  <!-- 散纸 -->
  <g fill="#3A3328" opacity="0.85">
    <path d="M700,596 h120 l-10,14 h-100 Z"/>
    <path d="M716,584 h104 l-8,12 h-88 Z"/>
  </g>

  <!-- 伏案剪影 -->
  <g fill="#3A3328">
    <circle cx="560" cy="430" r="32"/>
    <path d="M508,468 Q560,452 612,468 L612,556 Q560,574 508,556 Z"/>
    <path d="M606,492 C 656,502 688,536 684,584" stroke="#3A3328" stroke-width="22" fill="none" stroke-linecap="round"/>
    <rect x="678" y="576" width="8" height="46" rx="4" transform="rotate(-20 682 576)"/>
  </g>

  <!-- 煤油灯 -->
  <g fill="#3A3328">
    <rect x="812" y="570" width="16" height="14" rx="3"/>
    <rect x="816" y="512" width="8" height="58"/>
    <path d="M798,470 h44 c0,22 -6,30 -22,30 c-16,0 -22,-8 -22,-30 Z"/>
  </g>
  <ellipse cx="820" cy="454" rx="9" ry="13" fill="#A13A2A" opacity="0.9"/>
  <ellipse cx="820" cy="456" rx="4.5" ry="7" fill="#F3EAD7"/>

  <!-- 朱砂小印 -->
  <g transform="translate(1452,764)">
    <rect x="0" y="0" width="72" height="72" fill="none" stroke="#A13A2A" stroke-width="2.5" rx="2"/>
    <text x="36" y="34" text-anchor="middle" font-size="20" fill="#A13A2A">求</text>
    <text x="36" y="58" text-anchor="middle" font-size="20" fill="#A13A2A">是</text>
  </g>
</svg>
