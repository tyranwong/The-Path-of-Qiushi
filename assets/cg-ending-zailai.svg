<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Serif SC','Songti SC','SimSun',serif" xml:lang="zh-CN">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="88%">
      <stop offset="0%" stop-color="#F6EEDB"/>
      <stop offset="62%" stop-color="#F3EAD7"/>
      <stop offset="100%" stop-color="#E7D9BF"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="67"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
  <rect x="48" y="48" width="1504" height="804" fill="none" stroke="#3A3328" stroke-width="2" opacity="0.5"/>
  <rect x="60" y="60" width="1480" height="780" fill="none" stroke="#3A3328" stroke-width="1" opacity="0.22"/>

  <!-- 天窗光柱 -->
  <path d="M520,90 L980,90 L1120,320 L760,320 Z" fill="#F9E7BF" opacity="0.16"/>
  <path d="M560,90 L1020,90 L1160,320 L800,320 Z" fill="#F9E7BF" opacity="0.12"/>

  <!-- 墙上光影中的西迁路线 -->
  <path d="M580,600 C 640,540 700,500 760,440" stroke="#3A3328" stroke-width="2" fill="none" opacity="0.16" stroke-dasharray="6 6"/>

  <!-- 展柜 -->
  <g>
    <rect x="900" y="320" width="440" height="380" fill="#F6EEDB" stroke="#3A3328" stroke-width="5"/>
    <rect x="918" y="338" width="404" height="344" fill="#F4ECDC" opacity="0.55"/>
    <path d="M980,600 C 1040,560 1100,540 1160,500 C 1220,460 1260,430 1310,400" stroke="#3A3328" stroke-width="3" fill="none" opacity="0.8"/>
    <g fill="#A13A2A">
      <circle cx="980" cy="600" r="7"/>
      <circle cx="1040" cy="560" r="5.5"/>
      <circle cx="1100" cy="540" r="4.5"/>
      <circle cx="1160" cy="500" r="4.5"/>
      <circle cx="1310" cy="400" r="7"/>
    </g>
    <rect x="920" y="700" width="18" height="80" fill="#3A3328"/>
    <rect x="1302" y="700" width="18" height="80" fill="#3A3328"/>
  </g>

  <!-- 驻足回望的剪影 -->
  <g fill="#3A3328">
    <circle cx="700" cy="430" r="30"/>
    <path d="M660,468 Q700,452 740,468 L742,600 Q700,614 658,600 Z"/>
    <path d="M664,596 L654,700 L678,700 L686,596 Z"/>
    <path d="M730,596 L740,698 L764,698 L756,596 Z"/>
    <path d="M664,500 L646,570" stroke="#3A3328" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M736,500 L754,570" stroke="#3A3328" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 地面 -->
  <path d="M300,782 H1300" stroke="#3A3328" stroke-width="2" opacity="0.3"/>
  <ellipse cx="700" cy="784" rx="130" ry="10" fill="#3A3328" opacity="0.1"/>
  <ellipse cx="1120" cy="784" rx="230" ry="10" fill="#3A3328" opacity="0.08"/>

  <!-- 朱砂小印 -->
  <g transform="translate(1452,764)">
    <rect x="0" y="0" width="72" height="72" fill="none" stroke="#A13A2A" stroke-width="2.5" rx="2"/>
    <text x="36" y="34" text-anchor="middle" font-size="20" fill="#A13A2A">求</text>
    <text x="36" y="58" text-anchor="middle" font-size="20" fill="#A13A2A">是</text>
  </g>
</svg>
