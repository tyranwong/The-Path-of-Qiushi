<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Noto Serif SC','Songti SC','SimSun',serif" xml:lang="zh-CN">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="88%">
      <stop offset="0%" stop-color="#F6EEDB"/>
      <stop offset="62%" stop-color="#F3EAD7"/>
      <stop offset="100%" stop-color="#E7D9BF"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="41"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9E7BF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#F3EAD7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F3EAD7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>
  <rect x="48" y="48" width="1504" height="804" fill="none" stroke="#3A3328" stroke-width="2" opacity="0.5"/>
  <rect x="60" y="60" width="1480" height="780" fill="none" stroke="#3A3328" stroke-width="1" opacity="0.22"/>

  <!-- 暖光 -->
  <circle cx="700" cy="470" r="260" fill="url(#glow)" opacity="0.5"/>

  <!-- 守望相助：搀扶前行 -->
  <g fill="#3A3328">
    <!-- 左：搀扶者（直立） -->
    <circle cx="640" cy="430" r="30"/>
    <path d="M600,468 Q640,452 680,468 L682,600 Q640,614 598,600 Z"/>
    <path d="M606,596 L596,700 L620,700 L628,596 Z"/>
    <path d="M664,596 L674,698 L698,698 L690,596 Z"/>
    <path d="M672,490 C 730,510 762,542 766,584" stroke="#3A3328" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- 右：受扶者（微倾，持杖） -->
    <circle cx="792" cy="478" r="30"/>
    <path d="M754,512 Q782,528 810,516 L816,600 Q790,616 760,604 Z"/>
    <path d="M762,600 L752,700 L778,700 L784,600 Z"/>
    <path d="M800,600 L810,698 L834,698 L826,600 Z"/>
    <rect x="820" y="540" width="8" height="170" rx="4" transform="rotate(14 824 540)"/>
  </g>

  <!-- 地面 -->
  <path d="M360,708 H1240" stroke="#3A3328" stroke-width="2" opacity="0.3"/>
  <ellipse cx="700" cy="706" rx="240" ry="14" fill="#3A3328" opacity="0.1"/>

  <!-- 朱砂小印 -->
  <g transform="translate(1452,764)">
    <rect x="0" y="0" width="72" height="72" fill="none" stroke="#A13A2A" stroke-width="2.5" rx="2"/>
    <text x="36" y="34" text-anchor="middle" font-size="20" fill="#A13A2A">求</text>
    <text x="36" y="58" text-anchor="middle" font-size="20" fill="#A13A2A">是</text>
  </g>
</svg>
